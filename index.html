<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ALFA MOY SAM - Avtoyuvish</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            padding: 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #0b3b5c, #1a6b8a);
            color: #fff;
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .header h1 small {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.85;
            display: block;
        }
        .header .currency-badge {
            background: rgba(255, 255, 255, 0.18);
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1a3a4a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .form-group {
            flex: 1 1 100%;
            min-width: 80px;
        }
        .form-group.half {
            flex: 1 1 calc(50% - 5px);
            min-width: 80px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #2d4a5a;
            margin-bottom: 3px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #dce4ec;
            border-radius: 10px;
            font-size: 15px;
            background: #fafcfe;
            outline: none;
        }
        .form-group input:focus {
            border-color: #1a6b8a;
        }
        .expense-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .expense-grid .form-group {
            flex: unset;
            min-width: unset;
        }
        .expense-grid .form-group label {
            font-size: 11px;
        }
        .expense-grid .form-group input {
            padding: 8px 10px;
            font-size: 14px;
        }
        .expense-item-with-desc {
            grid-column: span 2;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f7fafc;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e8edf2;
            align-items: flex-end;
        }
        .expense-item-with-desc .form-group {
            flex: 1 1 100px;
            min-width: 70px;
        }
        .expense-item-with-desc .form-group:first-child {
            flex: 2 1 120px;
        }
        .expense-item-with-desc .form-group label {
            font-size: 11px;
        }
        .expense-item-with-desc .form-group input {
            padding: 8px 10px;
            font-size: 13px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            background: #1a6b8a;
            color: #fff;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0f5875;
        }
        .btn-danger {
            background: #b13e4a;
        }
        .btn-danger:hover {
            background: #962f3a;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #dce4ec;
            color: #2d4a5a;
        }
        .btn-sm {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            border-bottom: 2px solid #e8edf2;
            padding-bottom: 2px;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 8px 14px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            color: #5a7a8a;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #0b3b5c;
            background: #e4eef6;
            border-bottom: 3px solid #1a6b8a;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .stat-item {
            background: #f7fafc;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 1px solid #e8edf2;
        }
        .stat-item .stat-label {
            font-size: 10px;
            color: #5a7a8a;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .stat-item .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #0b3b5c;
        }
        .stat-item .stat-value.positive {
            color: #1e8b4c;
        }
        .stat-item .stat-value.negative {
            color: #b13e4a;
        }
        .chart-wrapper {
            height: 180px;
            margin-top: 8px;
        }
        .history-scroll {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e8edf2;
            border-radius: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #eef2f6;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-date {
            font-weight: 600;
            font-size: 14px;
        }
        .history-amount {
            font-weight: 600;
            color: #1e8b4c;
            font-size: 14px;
        }
        .history-desc {
            font-size: 12px;
            color: #5a7a8a;
        }
        .history-expenses {
            font-size: 11px;
            color: #b13e4a;
        }
        .delete-btn {
            background: #b13e4a;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #962f3a;
        }
        .period-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }
        .period-selector .form-group {
            flex: 1 1 100px;
            min-width: 80px;
        }
        .period-selector .form-group label {
            font-size: 10px;
        }
        .period-selector .form-group input,
        .period-selector .form-group select {
            padding: 6px 10px;
            font-size: 13px;
            border: 1.5px solid #dce4ec;
            border-radius: 8px;
            outline: none;
            background: #fafcfe;
        }
        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a3a4a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #1e6b3a;
        }
        .toast.error {
            background: #b13e4a;
        }
        .empty-state {
            padding: 30px 16px;
            text-align: center;
            color: #8a9aa8;
            font-size: 14px;
        }
        .empty-state .big-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }
        .footer {
            text-align: center;
            padding: 10px 0;
            color: #7a9aaa;
            font-size: 11px;
        }
        .desc-chip {
            display: inline-block;
            background: #d4edda;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
            color: #155724;
            margin-left: 4px;
        }
        @media (max-width: 480px) {
            .header h1 {
                font-size: 17px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stat-item .stat-value {
                font-size: 18px;
            }
            .btn {
                font-size: 13px;
                padding: 8px 16px;
            }
            .expense-grid {
                grid-template-columns: 1fr 1fr;
            }
            .expense-item-with-desc {
                grid-column: span 1;
                flex-direction: column;
            }
            .expense-item-with-desc .form-group {
                flex: 1 1 100%;
            }
        }
    </style>
</head>

// 🔐 PASSWORD PROTECTION (FIXED for Telegram)
// ============================================================
var APP_PASSWORD = 'alfamoy2026';

function checkPassword() {
    // If already authenticated, skip
    if (localStorage.getItem('authenticated') === 'true') {
        return true;
    }

    // Check lockout
    var lockUntil = parseInt(localStorage.getItem('lockUntil') || '0');
    var now = Date.now();

    if (lockUntil > now) {
        var remaining = Math.ceil((lockUntil - now) / 1000);
        var minutes = Math.floor(remaining / 60);
        var seconds = remaining % 60;
        var timeMsg = minutes > 0 ? minutes + ' daqiqa ' + seconds + ' soniya' : seconds + ' soniya';
        showLockScreen('🔒 Juda ko‘p urinishlar. Iltimos, ' + timeMsg + ' kuting.');
        return false;
    }

    var attempts = parseInt(localStorage.getItem('password_attempts') || '0');
    var entered = prompt('🔐 Iltimos, maxfiy kodni kiriting:');

    if (entered === APP_PASSWORD) {
        localStorage.setItem('authenticated', 'true');
        localStorage.setItem('password_attempts', '0');
        localStorage.removeItem('lockUntil');
        return true;
    } else {
        attempts++;
        localStorage.setItem('password_attempts', attempts.toString());

        if (attempts >= 3) {
            localStorage.setItem('lockUntil', (Date.now() + 60000).toString());
            showLockScreen('🔒 Juda ko‘p urinishlar. Iltimos, 1 daqiqa kuting.');
            return false;
        } else {
            alert('❌ Noto‘g‘ri kod! Yana ' + (3 - attempts) + ' ta urinish qoldi.');
            // Reload to try again
            setTimeout(function() { location.reload(); }, 500);
            return false;
        }
    }
}

    `;

        function showLockScreen(message) {

                    </div>
                </div>
            `;
        }

        // ============================================================
        // CONSTANTS
        // ============================================================
        var EXPENSE_CATEGORIES = ['foam', 'water', 'electricity', 'wax', 'spare_parts'];
        var CATEGORY_LABELS = {
            foam: '🧴 Pena',
            water: '💧 Suv',
            electricity: '⚡ Elektr',
            wax: '🕯️ Vosk',
            spare_parts: '🔧 Zapchast'
        };

        var allEntries = [];
        var overviewChartInstance = null;
        var expenseChartInstance = null;

        // ============================================================
        // HELPERS
        // ============================================================
        function formatMoney(val) {
            if (val === undefined || val === null) return '0';
            return Number(val).toLocaleString('uz-UZ');
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function parseDate(str) {
            if (!str) return new Date();
            var parts = str.split('-');
            return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]) || 1);
        }

        function isSameDay(d1, d2) { return d1 === d2; }

        function isSameWeek(dateStr, refDateStr) {
            var d = parseDate(dateStr);
            var ref = parseDate(refDateStr);
            var day = d.getDay();
            var diff = (day === 0 ? 6 : day - 1);
            var start = new Date(d);
            start.setDate(d.getDate() - diff);
            start.setHours(0, 0, 0, 0);
            var refDay = ref.getDay();
            var refDiff = (refDay === 0 ? 6 : refDay - 1);
            var refStart = new Date(ref);
            refStart.setDate(ref.getDate() - refDiff);
            refStart.setHours(0, 0, 0, 0);
            return start.getTime() === refStart.getTime();
        }

        function isSameMonth(dateStr, refDateStr) {
            var d = parseDate(dateStr);
            var ref = parseDate(refDateStr);
            return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth();
        }

        function isSameYear(dateStr, refDateStr) {
            return parseDate(dateStr).getFullYear() === parseDate(refDateStr).getFullYear();
        }

        function getWeekStart(dateStr) {
            var d = parseDate(dateStr);
            var day = d.getDay();
            var diff = (day === 0 ? 6 : day - 1);
            var s = new Date(d);
            s.setDate(d.getDate() - diff);
            s.setHours(0, 0, 0, 0);
            return s.toISOString().split('T')[0];
        }

        function getRefDate(period) {
            switch (period) {
                case 'day':
                    return document.getElementById('periodDate').value || getToday();
                case 'week':
                    return document.getElementById('periodWeekStart').value || getToday();
                case 'month':
                    return document.getElementById('periodMonth').value + '-01' || getToday();
                case 'year':
                    return document.getElementById('periodYear').value + '-01-01' || getToday();
                default:
                    return getToday();
            }
        }

        // ============================================================
        // DATA FUNCTIONS
        // ============================================================
        function filterEntries(period, refDate) {
            if (!refDate) refDate = getToday();
            var filtered = [];
            for (var i = 0; i < allEntries.length; i++) {
                var e = allEntries[i];
                var match = false;
                switch (period) {
                    case 'day':
                        match = isSameDay(e.date, refDate);
                        break;
                    case 'week':
                        match = isSameWeek(e.date, refDate);
                        break;
                    case 'month':
                        match = isSameMonth(e.date, refDate);
                        break;
                    case 'year':
                        match = isSameYear(e.date, refDate);
                        break;
                    default:
                        match = true;
                }
                if (match) filtered.push(e);
            }
            return filtered.sort(function(a, b) { return a.date < b.date ? -1 : 1; });
        }

        function computeTotals(entries) {
            var totalIncome = 0;
            var totalExpense = 0;
            var expenseBreakdown = {};
            for (var c = 0; c < EXPENSE_CATEGORIES.length; c++) {
                expenseBreakdown[EXPENSE_CATEGORIES[c]] = 0;
            }
            for (var i = 0; i < entries.length; i++) {
                var e = entries[i];
                totalIncome += Number(e.income) || 0;
                var exp = e.expenses || {};
                for (var c = 0; c < EXPENSE_CATEGORIES.length; c++) {
                    var cat = EXPENSE_CATEGORIES[c];
                    var val = Number(exp[cat]) || 0;
                    expenseBreakdown[cat] += val;
                    totalExpense += val;
                }
            }
            return { totalIncome: totalIncome, totalExpense: totalExpense, expenseBreakdown: expenseBreakdown };
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderSummary() {
            var period = document.getElementById('periodSelect').value;
            var refDate = getRefDate(period);
            if (!refDate) return;

            var entries = filterEntries(period, refDate);
            var totals = computeTotals(entries);
            var profit = totals.totalIncome - totals.totalExpense;

            document.getElementById('statIncome').textContent = formatMoney(totals.totalIncome);
            document.getElementById('statExpense').textContent = formatMoney(totals.totalExpense);
            document.getElementById('statProfit').textContent = formatMoney(profit);
            document.getElementById('statProfit').className = 'stat-value' + (profit >= 0 ? ' positive' : ' negative');
            document.getElementById('statDays').textContent = entries.length;

            // Expense breakdown
            for (var c = 0; c < EXPENSE_CATEGORIES.length; c++) {
                var cat = EXPENSE_CATEGORIES[c];
                var id = 'exp' + cat.split('_').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join('');
                var el = document.getElementById(id);
                if (el) el.textContent = formatMoney(totals.expenseBreakdown[cat] || 0);
            }

            renderOverviewChart(entries, period);
            renderExpenseChart(totals.expenseBreakdown);
            renderHistory(entries);
        }

        // ============================================================
        // CHARTS
        // ============================================================
        function renderOverviewChart(entries, period) {
            var ctx = document.getElementById('overviewChart').getContext('2d');
            if (overviewChartInstance) overviewChartInstance.destroy();

            if (!entries.length) {
                overviewChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Maʼlumot yo‘q'],
                        datasets: [
                            { label: 'Daromad', data: [0], backgroundColor: 'rgba(26,107,138,0.6)', borderRadius: 4 },
                            { label: 'Xarajat', data: [0], backgroundColor: 'rgba(200,70,80,0.6)', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'top' } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
                return;
            }

            var labels = [];
            var incomeData = [];
            var expenseData = [];

            for (var i = 0; i < entries.length; i++) {
                var e = entries[i];
                labels.push(e.date);
                incomeData.push(Number(e.income) || 0);
                var exp = 0;
                for (var c = 0; c < EXPENSE_CATEGORIES.length; c++) {
                    exp += Number(e.expenses?.[EXPENSE_CATEGORIES[c]]) || 0;
                }
                expenseData.push(exp);
            }

            overviewChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Daromad', data: incomeData, backgroundColor: 'rgba(26,107,138,0.75)',
                        borderRadius: 4 },
                        { label: 'Xarajat', data: expenseData, backgroundColor: 'rgba(200,70,80,0.70)',
                        borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function renderExpenseChart(expenseBreakdown) {
            var ctx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChartInstance) expenseChartInstance.destroy();

            var labels = [];
            var data = [];
            var colors = ['rgba(52,152,219,0.75)', 'rgba(46,204,113,0.75)', 'rgba(241,196,15,0.75)',
                'rgba(155,89,182,0.75)', 'rgba(192,57,43,0.75)'
            ];

            for (var c = 0; c < EXPENSE_CATEGORIES.length; c++) {
                var cat = EXPENSE_CATEGORIES[c];
                labels.push(CATEGORY_LABELS[cat]);
                data.push(expenseBreakdown[cat] || 0);
            }

            expenseChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    var total = ctx.dataset.data.reduce(function(a, b) { return a + b; }, 0);
                                    var pct = total > 0 ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                                    return ctx.label + ': ' + formatMoney(ctx.parsed) + ' so‘m (' + pct + '%)';
                                }
                            }
                        }
                    }
                }
            });
        }

        // ============================================================
        // HISTORY
        // ============================================================
        function renderHistory(entries) {
            var container = document.getElementById('historyContainer');
            if (!entries.length) {
                container.innerHTML = '<div class="empty-state"><span class="big-icon">📭</span>Bu davrda hech qanday ma\'lumot yo‘q.</div>';
                return;
            }

            var sorted = entries.slice().sort(function(a, b) { return a.date < b.date ? 1 : -1; });
            var html = '';

            for (var i = 0; i < sorted.length; i++) {
                var e = sorted[i];
                var totalExp = 0;
                var expParts = [];
                for (var c = 0; c < EXPENSE_CATEGORIES.length; c++) {
                    var cat = EXPENSE_CATEGORIES[c];
                    var val = Number(e.expenses?.[cat]) || 0;
                    totalExp += val;
                    if (val > 0) {
                        var label = CATEGORY_LABELS[cat];
                        if (cat === 'spare_parts' && e.spare_desc) {
                            label += ' <span class="desc-chip">' + e.spare_desc + '</span>';
                        }
                        expParts.push(label + ': ' + formatMoney(val));
                    }
                }
                var profit = (Number(e.income) || 0) - totalExp;

                html += '<div class="history-item">';
                html += '<div>';
                html += '<div class="history-date">' + e.date + '</div>';
                if (e.description) html += '<div class="history-desc">' + e.description + '</div>';
                if (expParts.length) html += '<div class="history-expenses">' + expParts.join(' | ') + '</div>';
                html += '</div>';
                html += '<div style="display:flex; align-items:center; gap:8px;">';
                html += '<div style="text-align:right;">';
                html += '<div class="history-amount">' + formatMoney(e.income) + ' so‘m</div>';
                html += '<div style="font-size:11px; color:' + (profit >= 0 ? '#1e8b4c' : '#b13e4a') + ';">' +
                    (profit >= 0 ? '✅' : '❌') + ' ' + formatMoney(profit) + '</div>';
                html += '</div>';
                html += '<button class="delete-btn" onclick="deleteEntry(\'' + e.date + '\')">🗑️</button>';
                html += '</div></div>';
            }

            container.innerHTML = html;
        }

        // ============================================================
        // CRUD OPERATIONS
        // ============================================================
        function loadEntries() {
            try {
                var saved = localStorage.getItem('alfamoy_entries');
                if (saved) {
                    allEntries = JSON.parse(saved);
                }
            } catch (e) {
                allEntries = [];
            }
            renderSummary();
        }

        function saveEntries() {
            localStorage.setItem('alfamoy_entries', JSON.stringify(allEntries));
            renderSummary();
        }

        function addEntry() {
            var date = document.getElementById('entryDate').value;
            var income = parseFloat(document.getElementById('incomeInput').value) || 0;
            var description = document.getElementById('entryDescription').value.trim() || '';

            if (!date) {
                showToast('Iltimos, sanani tanlang!', 'error');
                return;
            }

            var expenses = {};
            var expenseInputs = document.querySelectorAll('.expense-input');
            for (var i = 0; i < expenseInputs.length; i++) {
                var inp = expenseInputs[i];
                var cat = inp.dataset.category;
                expenses[cat] = parseFloat(inp.value) || 0;
            }

            var spareDesc = document.querySelector('.expense-desc-input')?.value.trim() || '';

            var existingIndex = -1;
            for (var i = 0; i < allEntries.length; i++) {
                if (allEntries[i].date === date) {
                    existingIndex = i;
                    break;
                }
            }

            if (existingIndex !== -1) {
                if (!confirm('"' + date + '" sanasi uchun yozuv mavjud. Yangilashni xohlaysizmi?')) return;
                allEntries[existingIndex] = { date: date, income: income, description: description, expenses: expenses,
                    spare_desc: spareDesc };
            } else {
                allEntries.push({ date: date, income: income, description: description, expenses: expenses,
                    spare_desc: spareDesc });
            }

            saveEntries();
            clearForm();
            showToast('✅ ' + date + ' uchun saqlandi!', 'success');
        }

        function deleteEntry(date) {
            if (!confirm('"' + date + '" sanadagi yozuvni o‘chirish?')) return;
            var newEntries = [];
            for (var i = 0; i < allEntries.length; i++) {
                if (allEntries[i].date !== date) {
                    newEntries.push(allEntries[i]);
                }
            }
            allEntries = newEntries;
            saveEntries();
            showToast('🗑️ ' + date + ' o‘chirildi', 'success');
        }

        function clearAll() {
            if (allEntries.length === 0) {
                showToast('Hech qanday maʼlumot yo‘q', 'error');
                return;
            }
            if (!confirm('🚨 Barcha maʼlumotlarni o‘chirish?')) return;
            allEntries = [];
            saveEntries();
            showToast('🗑️ Barchasi tozalandi', 'success');
        }

        function clearForm() {
            document.getElementById('entryDate').value = getToday();
            document.getElementById('incomeInput').value = '';
            document.getElementById('entryDescription').value = '';
            var expenseInputs = document.querySelectorAll('.expense-input');
            for (var i = 0; i < expenseInputs.length; i++) {
                expenseInputs[i].value = '';
            }
            var descInput = document.querySelector('.expense-desc-input');
            if (descInput) descInput.value = '';
        }

        function showToast(msg, type) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + (type || 'success');
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(function() {
                el.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // PERIOD UI TOGGLES
        // ============================================================
        function updatePeriodUI() {
            var period = document.getElementById('periodSelect').value;
            document.getElementById('periodDateGroup').style.display = (period === 'day') ? 'block' : 'none';
            document.getElementById('periodWeekGroup').style.display = (period === 'week') ? 'block' : 'none';
            document.getElementById('periodMonthGroup').style.display = (period === 'month') ? 'block' : 'none';
            document.getElementById('periodYearGroup').style.display = (period === 'year') ? 'block' : 'none';

            var today = getToday();
            if (period === 'day') {
                if (!document.getElementById('periodDate').value) document.getElementById('periodDate').value = today;
            } else if (period === 'week') {
                if (!document.getElementById('periodWeekStart').value) document.getElementById('periodWeekStart').value =
                    getWeekStart(today);
            } else if (period === 'month') {
                if (!document.getElementById('periodMonth').value) document.getElementById('periodMonth').value = today.slice(
                    0, 7);
            } else if (period === 'year') {
                if (!document.getElementById('periodYear').value) document.getElementById('periodYear').value = new Date()
                    .getFullYear().toString();
            }
            renderSummary();
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tabId) {
            var panes = document.querySelectorAll('.tab-pane');
            for (var i = 0; i < panes.length; i++) {
                panes[i].classList.remove('active');
            }
            var btns = document.querySelectorAll('.tab-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
            }
            document.getElementById('tab-' + tabId).classList.add('active');
            var activeBtn = document.querySelector('.tab-btn[data-tab="' + tabId + '"]');
            if (activeBtn) activeBtn.classList.add('active');
            if (tabId === 'overview' || tabId === 'expenses') renderSummary();
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            console.log('🚀 ALFA MOY SAM starting...');

            if (!checkPassword()) return;

            document.getElementById('entryDate').value = getToday();
            updatePeriodUI();
            loadEntries();

            document.getElementById('addBtn').addEventListener('click', addEntry);
            document.getElementById('clearBtn').addEventListener('click', clearAll);
            document.getElementById('refreshBtn').addEventListener('click', loadEntries);

            document.getElementById('periodSelect').addEventListener('change', updatePeriodUI);
            document.getElementById('periodDate').addEventListener('change', renderSummary);
            document.getElementById('periodWeekStart').addEventListener('change', renderSummary);
            document.getElementById('periodMonth').addEventListener('change', renderSummary);
            document.getElementById('periodYear').addEventListener('change', renderSummary);

            var tabBtns = document.querySelectorAll('.tab-btn');
            for (var i = 0; i < tabBtns.length; i++) {
                tabBtns[i].addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            }

            document.getElementById('incomeInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addEntry();
            });

            console.log('✅ ALFA MOY SAM loaded!');
            console.log('📊 Entries:', allEntries.length);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
